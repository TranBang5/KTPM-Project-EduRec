user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Rate limiting zones - relaxed for load testing (raise rates/burst)
    # Note: tighten again for production
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=30000r/m;
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5000r/m;
    limit_req_zone $binary_remote_addr zone=auth_register:10m rate=3000r/m;
    limit_req_zone $binary_remote_addr zone=api_gateway:10m rate=30000r/m;

    # Upstream for API Gateway
    upstream api_gateway {
        least_conn;
        server api-gateway-1:5000 max_fails=3 fail_timeout=30s;
        server api-gateway-2:5000 max_fails=3 fail_timeout=30s;
        server api-gateway-3:5000 max_fails=3 fail_timeout=30s;
    }

    # Upstream for Auth Service
    upstream auth_service {
        least_conn;
        keepalive 32;
        server auth-service-1:5004 max_fails=3 fail_timeout=30s;
        server auth-service-2:5004 max_fails=3 fail_timeout=30s;
        server auth-service-3:5004 max_fails=3 fail_timeout=30s;
    }

    # Main server block
    server {
        listen 80;
        server_name _;

        # Global rate limiting - higher burst for load testing
        limit_req zone=global_limit burst=2000 nodelay;

        # Health check endpoint (no rate limit) - Important for monitoring
        location /health {
            # No rate limiting for health checks - limit_req directive not included
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # Auth endpoints with specific rate limiting
        # Route directly to auth service instances (bypass API Gateway for better performance)
        
        # Login endpoint - only apply auth_login rate limit
        location /auth/login {
            limit_req zone=auth_login burst=800 nodelay;
            
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Register endpoint - only apply auth_register rate limit
        location /auth/register {
            limit_req zone=auth_register burst=500 nodelay;
            
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # All other auth endpoints
        location /auth/ {
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # All other endpoints go to API Gateway
        location / {
            limit_req zone=api_gateway burst=2000 nodelay;
            
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 180s;  # Longer for recommendation service
        }

        # Error pages
        error_page 429 /429.html;
        error_page 502 503 504 /50x.html;
        
        location = /429.html {
            internal;
            return 429 '{"error": "Rate limit exceeded. Please try again later."}';
            add_header Content-Type application/json;
        }
        
        location = /50x.html {
            internal;
            return 503 '{"error": "Service temporarily unavailable. Please try again later."}';
            add_header Content-Type application/json;
        }
    }
}

