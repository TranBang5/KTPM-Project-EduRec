# Removed version - it's obsolete in newer docker-compose

services:
  # Database service
  db:
    image: mysql:8.0
    container_name: edurec-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-recommendation}
      MYSQL_USER: ${MYSQL_USER:-edurec}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-edurecpassword}
    ports:
      - "3307:3306"  # Map container port 3306 to host port 3307 to avoid conflict
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - edurec-network

  # Flask application instance 1
  app1:
    build: .
    container_name: edurec-app1
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-edurec}:${MYSQL_PASSWORD:-edurecpassword}@db:3306/${MYSQL_DATABASE:-recommendation}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-secret-key-change-in-production}
    depends_on:
      - db
    networks:
      - edurec-network
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./instance:/app/instance

  # Flask application instance 2
  app2:
    build: .
    container_name: edurec-app2
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-edurec}:${MYSQL_PASSWORD:-edurecpassword}@db:3306/${MYSQL_DATABASE:-recommendation}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-secret-key-change-in-production}
    depends_on:
      - db
    networks:
      - edurec-network
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./instance:/app/instance

  # Flask application instance 3
  app3:
    build: .
    container_name: edurec-app3
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-edurec}:${MYSQL_PASSWORD:-edurecpassword}@db:3306/${MYSQL_DATABASE:-recommendation}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-secret-key-change-in-production}
    depends_on:
      - db
    networks:
      - edurec-network
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./instance:/app/instance

  # Nginx load balancer
  nginx:
    image: nginx:alpine
    container_name: edurec-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - edurec-network

volumes:
  mysql_data:

networks:
  edurec-network:
    driver: bridge

