# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;  # 10 requests per second cho API
limit_req_zone $binary_remote_addr zone=frontend_limit:10m rate=30r/s;  # 30 requests per second cho Frontend

upstream api_gateway {
    # Load balancing với round-robin (mặc định)
    server api-gateway-1:5000;
    server api-gateway-2:5000;
    server api-gateway-3:5000;
}

upstream frontend {
    server frontend:8080;
}

server {
    listen 80;
    server_name localhost;

    # Max upload size
    client_max_body_size 20M;

    # Frontend routes - forward to frontend container
    location ~ ^/(dashboard|study_plan|profile|recommendations|login|register|feedback|$) {
        # Rate limiting cho frontend
        limit_req zone=frontend_limit burst=20 nodelay;
        limit_req_status 429;
        
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static files - forward to frontend
    location /static/ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
    }

    # API routes - forward to API Gateway
    location / {
        # Rate limiting cho API
        limit_req zone=api_limit burst=15 nodelay;
        limit_req_status 429;
        
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Error page cho rate limit
    error_page 429 @ratelimit;
    location @ratelimit {
        default_type application/json;
        return 429 '{"error": "Too many requests", "message": "Rate limit exceeded. Please try again later."}';
    }
}
